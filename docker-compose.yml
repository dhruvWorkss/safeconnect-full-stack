services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: safeconnect, POSTGRES_USER: safeconnect, POSTGRES_PASSWORD: safeconnect }
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
  api:
    build: ./backend
    command: sh -c "python manage.py migrate && gunicorn safeconnect.wsgi:application --bind 0.0.0.0:8000"
    environment: { POSTGRES_DB: safeconnect, POSTGRES_USER: safeconnect, POSTGRES_PASSWORD: safeconnect, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0, CORS_ALLOWED_ORIGINS: http://localhost:3000 }
    ports: ["8000:8000"]
    depends_on: [db, redis]
  worker:
    build: ./backend
    command: celery -A safeconnect worker -l info
    environment: { POSTGRES_DB: safeconnect, POSTGRES_USER: safeconnect, POSTGRES_PASSWORD: safeconnect, POSTGRES_HOST: db, REDIS_URL: redis://redis:6379/0 }
    depends_on: [db, redis]
volumes: { postgres_data: {} }
