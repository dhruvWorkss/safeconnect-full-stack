services:
  - type: web
    name: safeconnect-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py migrate && python manage.py seed_demo && gunicorn safeconnect.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /api/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safeconnect-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: safeconnect-api-qyfu.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://safeconnect-trust-safety.luffyy1707.chatgpt.site

databases:
  - name: safeconnect-db
    plan: free
    databaseName: safeconnect
    user: safeconnect
